# .github/codeql/html-javascript-rules.yml
name: "HTML/JavaScript Security Rules"

queries:
  - uses: security-and-quality
  - uses: security-extended
  
  # Custom rules for web applications
  - id: html/security/script-injection
    severity: error
    description: "Script injection vulnerabilities in HTML"
    query: |
      /**
       * @name Script injection in HTML
       * @description Detects potential script injection points in HTML
       * @kind problem
       * @problem.severity error
       * @security-severity 8.0
       */
      import javascript
      import semmle.javascript.security.dataflow.scriptinjection.ScriptInjectionQuery

  - id: javascript/security/unsafe-inner-html
    severity: error
    description: "Unsafe use of innerHTML can lead to XSS"
    query: |
      /**
       * @name Unsafe innerHTML assignment
       * @description Using innerHTML with unsanitized data can lead to XSS
       * @kind problem
       * @problem.severity error
       * @security-severity 7.5
       */
      import javascript
      import semmle.javascript.security.dataflow.scriptinjection.HtmlInjectionQuery

  - id: javascript/security/eval-usage
    severity: error
    description: "Use of eval() is dangerous"
    query: |
      /**
       * @name Use of eval()
       * @description eval() can lead to code injection
       * @kind problem
       * @problem.severity error
       * @security-severity 8.5
       */
      import javascript
      from EvalCall evalCall
      select evalCall, "Use of eval() can lead to code injection"
